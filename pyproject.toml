[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bio-dissertation-generator"
version = "0.1.0"
description = "Automated LaTeX dissertation generator and Life Sciences skill suite for Biology & Zoology"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sahil Langoo", email = "sahillangoo@users.noreply.github.com" },
]
keywords = ["dissertation", "latex", "tectonic", "biology", "zoology", "antigravity", "skills"]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
]

[project.scripts]
dissertation-build = "build:cli"
dissertation-verify = "verify:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
include = [
    "build.py",
    "verify.py",
    "docx_export.py",
    "preamble_docx.tex",
]

